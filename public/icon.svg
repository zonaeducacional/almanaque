<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B2C" />
      <stop offset="100%" stop-color="#142B1A" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD80" />
      <stop offset="60%" stop-color="#E5A642" />
      <stop offset="100%" stop-color="#C27A23" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BBF76" />
      <stop offset="100%" stop-color="#3A8A48" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sol Dourado Central (Solarpunk) -->
  <circle cx="256" cy="210" r="105" fill="url(#sunGrad)" filter="url(#softGlow)" />

  <!-- Raios Solares Geométricos Discretos -->
  <g stroke="#FDE49E" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="75" x2="256" y2="92" />
    <line x1="256" y1="328" x2="256" y2="345" />
    <line x1="121" y1="210" x2="138" y2="210" />
    <line x1="374" y1="210" x2="391" y2="210" />
    <line x1="160" y1="114" x2="173" y2="127" />
    <line x1="339" y1="293" x2="352" y2="306" />
    <line x1="352" y1="114" x2="339" y2="127" />
    <line x1="173" y1="293" x2="160" y2="306" />
  </g>

  <!-- Montanha / Linha de Horizonte da Terra -->
  <path d="M60 410 Q 180 340, 256 360 T 452 410 L 452 460 L 60 460 Z" fill="#1C3822" />

  <!-- Folha / Broto Emergente -->
  <path d="M256 370 C 230 300, 200 250, 256 185 C 312 250, 282 300, 256 370 Z" fill="url(#leafGrad)" />
  <!-- Nervura central da folha -->
  <path d="M256 370 Q 256 270, 256 195" stroke="#E6F4EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <!-- Pequeno ramo secundário -->
  <path d="M256 260 Q 240 245, 226 242" stroke="#E6F4EA" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M256 240 Q 272 225, 286 222" stroke="#E6F4EA" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Livro Aberto / Páginas Finitas na Base -->
  <path d="M190 405 C 220 395, 250 402, 256 405 C 262 402, 292 395, 322 405 L 322 422 C 292 412, 262 419, 256 422 C 250 419, 220 412, 190 422 Z" fill="#F4EDE0" opacity="0.95" />
</svg>
